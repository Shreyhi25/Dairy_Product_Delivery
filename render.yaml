services:
  - type: web
    name: dairy-delivery
    env: python
    rootDir: /opt/render/project/src
    buildCommand: |
      chmod +x build.sh
      ./build.sh
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-db
          property: connectionString 